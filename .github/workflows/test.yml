name: test

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"
          # elixir-version: "1"
      # The libsql_gleam NIF is not shipped by its hex package (no release
      # assets upstream), so the Rust NIF is built from source before any
      # database-backed code can run. See scripts/build-libsql-nif.sh.
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/build-libsql-nif.sh
      - run: gleam deps download
      - run: gleam test
      - run: gleam format --check src test
